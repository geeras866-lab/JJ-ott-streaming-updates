<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>JJ OTT Streaming Updates</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="header">

    <div class="brand">
        <div class="jj-logo">JJ</div>

        <div>
            <h1>OTT Streaming Updates</h1>
            <p>Movies • Series • OTT News</p>
        </div>
    </div>

    <div class="header-actions">

        <button id="loginBtn" class="login-btn">
            🔐 Admin Login
        </button>

        <button id="createBtn" class="post-btn hidden">
            ＋ Create Post
        </button>

        <button id="logoutBtn" class="logout-btn hidden">
            Logout
        </button>

    </div>

</header>


<main>

    <section id="createSection" class="create-section hidden">

        <div class="form-header">

            <div>
                <h2>Create New Post</h2>
                <p>Share the latest OTT update</p>
            </div>

            <button id="closeBtn" class="close-btn">
                ✕
            </button>

        </div>


        <div class="form-grid">

            <div class="poster-area">

                <div id="imagePreview" class="poster-preview">

                    <div class="poster-placeholder">
                        <span>🎬</span>
                        <p>Select Poster</p>
                    </div>

                </div>

                <label class="upload-btn">

                    📷 Choose Poster

                    <input
                        id="imageInput"
                        type="file"
                        accept="image/*"
                    >

                </label>

            </div>


            <div class="form-fields">

                <label>Movie / Series Name</label>

                <input
                    id="titleInput"
                    type="text"
                    placeholder="Eg: Toxic"
                >


                <label>OTT Platform</label>

                <select id="platformInput">

                    <option value="">
                        Select OTT Platform
                    </option>

                    <option>Netflix</option>
                    <option>Prime Video</option>
                    <option>ZEE5</option>
                    <option>JioHotstar</option>
                    <option>SonyLIV</option>
                    <option>Aha</option>
                    <option>Sun NXT</option>
                    <option>Other</option>

                </select>


                <label>Streaming Date</label>

                <input
                    id="dateInput"
                    type="date"
                >


                <label>Information</label>

                <textarea
                    id="descriptionInput"
                    placeholder="Write the OTT streaming update..."
                ></textarea>


                <button
                    id="publishBtn"
                    class="publish-btn">

                    🚀 Publish Update

                </button>

            </div>

        </div>

    </section>


    <section class="feed-section">

        <div class="feed-heading">

            <div>
                <h2>Latest Updates</h2>

                <p>
                    Latest OTT streaming information
                </p>
            </div>

            <span id="postCount">
                0 Posts
            </span>

        </div>


        <div id="feed"></div>

    </section>

</main>


<section id="emptyState" class="empty-state">

    <div class="empty-icon">
        🎬
    </div>

    <h2>No Updates Yet</h2>

    <p>
        Your OTT streaming updates will appear here.
    </p>

    <button
        id="firstPostBtn"
        class="empty-button hidden">

        ＋ Create First Post

    </button>

</section>


<div id="loginModal" class="login-modal hidden">

    <div class="login-box">

        <button id="closeLoginBtn" class="login-close">
            ✕
        </button>

        <h2>Admin Login</h2>

        <p>
            Only admin can create and delete posts.
        </p>


        <label>Email</label>

        <input
            id="emailInput"
            type="email"
            placeholder="Admin email"
        >


        <label>Password</label>

        <input
            id="passwordInput"
            type="password"
            placeholder="Password"
        >


        <button id="submitLoginBtn" class="login-submit">
            🔐 Login
        </button>

        <p id="loginMessage" class="login-message"></p>

    </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="app.js"></script>

</body>

</html>
