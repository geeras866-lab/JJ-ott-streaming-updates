<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>JJ OTT Streaming Updates</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="header">

    <div class="brand">
        <div class="jj-logo">JJ</div>

        <div>
            <h1>OTT Streaming Updates</h1>
            <p>Movies • Series • OTT News</p>
        </div>
    </div>

    <button id="createBtn" class="post-btn">
        ＋ Create Post
    </button>

</header>


<main>

    <!-- CREATE POST -->

    <section id="createSection" class="create-section hidden">

        <div class="form-header">

            <div>
                <h2>Create New Post</h2>
                <p>Share the latest OTT update</p>
            </div>

            <button id="closeBtn" class="close-btn">
                ✕
            </button>

        </div>


        <div class="form-grid">

            <div class="poster-area">

                <div id="imagePreview" class="poster-preview">

                    <div class="poster-placeholder">
                        <span>🎬</span>
                        <p>Select Poster</p>
                    </div>

                </div>

                <label class="upload-btn">

                    📷 Choose Poster

                    <input
                        id="imageInput"
                        type="file"
                        accept="image/*"
                    >

                </label>

            </div>


            <div class="form-fields">

                <label>Movie / Series Name</label>

                <input
                    id="titleInput"
                    type="text"
                    placeholder="Eg: Toxic"
                >


                <label>OTT Platform</label>

                <select id="platformInput">

                    <option value="">
                        Select OTT Platform
                    </option>

                    <option>Netflix</option>
                    <option>Prime Video</option>
                    <option>ZEE5</option>
                    <option>JioHotstar</option>
                    <option>SonyLIV</option>
                    <option>Aha</option>
                    <option>Sun NXT</option>
                    <option>Other</option>

                </select>


                <label>Streaming Date</label>

                <input
                    id="dateInput"
                    type="date"
                >


                <label>Information</label>

                <textarea
                    id="descriptionInput"
                    placeholder="Write the OTT streaming update..."
                ></textarea>


                <button
                    id="publishBtn"
                    class="publish-btn">

                    🚀 Publish Update

                </button>

            </div>

        </div>

    </section>


    <!-- FEED -->

    <section class="feed-section">

        <div class="feed-heading">

            <div>
                <h2>Latest Updates</h2>

                <p>
                    Latest OTT streaming information
                </p>
            </div>

            <span id="postCount">
                0 Posts
            </span>

        </div>


        <div id="feed"></div>

    </section>

</main>


<!-- EMPTY -->

<section id="emptyState" class="empty-state">

    <div class="empty-icon">
        🎬
    </div>

    <h2>No Updates Yet</h2>

    <p>
        Your OTT streaming updates will appear here.
    </p>

    <button
        id="firstPostBtn"
        class="empty-button">

        ＋ Create First Post

    </button>

</section>


<script src="app.js"></script>

</body>
</html>
